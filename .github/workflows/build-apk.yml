name: Build Nivora Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Verify pushed revision
        run: |
          echo "Git commit: $(git rev-parse HEAD)"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Version: $(grep '^version:' pubspec.yaml)"
          echo "Widget test before scaffolding:"
          if [ -f test/widget_test.dart ]; then
            sed -n '1,30p' test/widget_test.dart
          else
            echo "No widget test committed; CI will restore the Nivora smoke test."
          fi

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android native scaffold
        run: |
          flutter create --platforms=android --org=com.nivora --project-name=nivora_booking .
          python3 scripts/configure_android.py

      - name: Repair autogenerated Flutter widget test
        run: |
          python3 scripts/repair_widget_test.py
          echo "Widget test now checks the real NivoraApp root:"
          grep -n 'NivoraApp' test/widget_test.dart
          if grep -nE '\bMyApp[[:space:]]*\(' test/widget_test.dart; then
            echo "::error file=test/widget_test.dart::Unexpected MyApp reference; aborting."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NivoraBooking-v1.0.2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
